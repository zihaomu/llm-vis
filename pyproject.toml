[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-vis"
version = "0.1.0"
description = "Config-first LLM architecture and performance visualization toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LLM-Vis contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
capture = [
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
]

[project.scripts]
llm-vis = "llm_vis.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_vis"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"src/llm_vis/report/html.py" = ["E501"]
